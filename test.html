<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>注音符號練習單 (ㄅ~ㄏ)</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 1.5cm;
    }
    body {
      font-family: "標楷體", "BiauKai", "DFKai-SB", sans-serif;
      margin: 0;
      padding: 0;
      background: #fff;
    }
    h1 {
      text-align: center;
      font-size: 20pt;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }
    .table-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .row-title {
      font-size: 14pt;
      font-weight: bold;
      width: 80px;
    }
    .grid-group {
      display: flex;
      gap: 4px;
    }
    /* 精準設定 1.5cm x 1.5cm 格子 */
    .cell {
      width: 1.5cm;
      height: 1.5cm;
      border: 1px solid #999;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1cm; /* 字體大小適中 */
      position: relative;
    }
    /* 米字輔助線（淡灰色） */
    .cell::before, .cell::after {
      content: "";
      position: absolute;
      background-color: #e0e0e0;
    }
    .cell::before {
      top: 50%; left: 0; width: 100%; height: 1px;
      border-top: 1px dashed #ccc;
    }
    .cell::after {
      left: 50%; top: 0; height: 100%; width: 1px;
      border-left: 1px dashed #ccc;
    }
    .char {
      position: relative;
      z-index: 1;
    }
    /* 實體字 */
    .solid {
      color: #000;
    }
    /* 虛線/淺色描紅字 */
    .dashed {
      color: #bbb;
      -webkit-text-stroke: 1px #999;
    }
    /* 空白格 */
    .blank {
      color: transparent;
    }
  </style>
</head>
<body>

  <h1>注音符號筆順練習單 (ㄅ～ㄏ)</h1>

  <div class="table-container">
    <!-- 實體字排 -->
    <div class="row">
      <div class="row-title">實體示範</div>
      <div class="grid-group">
        <div class="cell solid"><span class="char">ㄅ</span></div>
        <div class="cell solid"><span class="char">ㄆ</span></div>
        <div class="cell solid"><span class="char">ㄇ</span></div>
        <div class="cell solid"><span class="char">ㄈ</span></div>
        <div class="cell solid"><span class="char">ㄉ</span></div>
        <div class="cell solid"><span class="char">ㄊ</span></div>
        <div class="cell solid"><span class="char">ㄋ</span></div>
        <div class="cell solid"><span class="char">ㄌ</span></div>
        <div class="cell solid"><span class="char">ㄍ</span></div>
        <div class="cell solid"><span class="char">ㄎ</span></div>
        <div class="cell solid"><span class="char">ㄏ</span></div>
        <div class="cell solid"><span class="char">ㄐ</span></div>
        <div class="cell solid"><span class="char">ㄑ</span></div>
        <div class="cell solid"><span class="char">ㄒ</span></div>
        <div class="cell solid"><span class="char">ㄓ</span></div>
        <div class="cell solid"><span class="char">ㄔ</span></div>
        <div class="cell solid"><span class="char">ㄕ</span></div>
        <div class="cell solid"><span class="char">ㄖ</span></div>
      </div>
    </div>

    <!-- 描紅字排 -->
    <div class="row">
      <div class="row-title">虛線描紅</div>
      <div class="grid-group">
        <div class="cell dashed"><span class="char">ㄅ</span></div>
        <div class="cell dashed"><span class="char">ㄆ</span></div>
        <div class="cell dashed"><span class="char">ㄇ</span></div>
        <div class="cell dashed"><span class="char">ㄈ</span></div>
        <div class="cell dashed"><span class="char">ㄉ</span></div>
        <div class="cell dashed"><span class="char">ㄊ</span></div>
        <div class="cell dashed"><span class="char">ㄋ</span></div>
        <div class="cell dashed"><span class="char">ㄌ</span></div>
        <div class="cell dashed"><span class="char">ㄍ</span></div>
        <div class="cell dashed"><span class="char">ㄎ</span></div>
        <div class="cell dashed"><span class="char">ㄏ</span></div>
        <div class="cell dashed"><span class="char">ㄐ</span></div>
        <div class="cell dashed"><span class="char">ㄑ</span></div>
        <div class="cell dashed"><span class="char">ㄒ</span></div>
        <div class="cell dashed"><span class="char">ㄓ</span></div>
        <div class="cell dashed"><span class="char">ㄔ</span></div>
        <div class="cell dashed"><span class="char">ㄕ</span></div>
        <div class="cell dashed"><span class="char">ㄖ</span></div>
      </div>
    </div>

    <!-- 空白格排 1 -->
    <div class="row">
      <div class="row-title">自主練習 1</div>
      <div class="grid-group">
        <div class="cell blank"><span class="char">ㄅ</span></div>
        <div class="cell blank"><span class="char">ㄆ</span></div>
        <div class="cell blank"><span class="char">ㄇ</span></div>
        <div class="cell blank"><span class="char">ㄈ</span></div>
        <div class="cell blank"><span class="char">ㄉ</span></div>
        <div class="cell blank"><span class="char">ㄊ</span></div>
        <div class="cell blank"><span class="char">ㄋ</span></div>
        <div class="cell blank"><span class="char">ㄌ</span></div>
        <div class="cell blank"><span class="char">ㄍ</span></div>
        <div class="cell blank"><span class="char">ㄎ</span></div>
        <div class="cell blank"><span class="char">ㄏ</span></div>
        <div class="cell blank"><span class="char">ㄐ</span></div>
        <div class="cell blank"><span class="char">ㄑ</span></div>
        <div class="cell blank"><span class="char">ㄒ</span></div>
        <div class="cell blank"><span class="char">ㄓ</span></div>
        <div class="cell blank"><span class="char">ㄔ</span></div>
        <div class="cell blank"><span class="char">ㄕ</span></div>
        <div class="cell blank"><span class="char">ㄖ</span></div>
      </div>
    </div>

    <!-- 空白格排 2 -->
    <div class="row">
      <div class="row-title">自主練習 2</div>
      <div class="grid-group">
        <div class="cell blank"><span class="char">ㄅ</span></div>
        <div class="cell blank"><span class="char">ㄆ</span></div>
        <div class="cell blank"><span class="char">ㄇ</span></div>
        <div class="cell blank"><span class="char">ㄈ</span></div>
        <div class="cell blank"><span class="char">ㄉ</span></div>
        <div class="cell blank"><span class="char">ㄊ</span></div>
        <div class="cell blank"><span class="char">ㄋ</span></div>
        <div class="cell blank"><span class="char">ㄌ</span></div>
        <div class="cell blank"><span class="char">ㄍ</span></div>
        <div class="cell blank"><span class="char">ㄎ</span></div>
        <div class="cell blank"><span class="char">ㄏ</span></div>
        <div class="cell blank"><span class="char">ㄐ</span></div>
        <div class="cell blank"><span class="char">ㄑ</span></div>
        <div class="cell blank"><span class="char">ㄒ</span></div>
        <div class="cell blank"><span class="char">ㄓ</span></div>
        <div class="cell blank"><span class="char">ㄔ</span></div>
        <div class="cell blank"><span class="char">ㄕ</span></div>
        <div class="cell blank"><span class="char">ㄖ</span></div>
      </div>
    </div>
  </div>

</body>
</html>
